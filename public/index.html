/* SUCCESS ANIMATION CSS */
/* ═══════════════════════════════════════════════════════════════ */
@keyframes successPopIn {
  0% { opacity:0; transform:scale(0.7); }
  100% { opacity:1; transform:scale(1); }
}
@keyframes successPopOut {
  0% { opacity:1; transform:scale(1); }
  100% { opacity:0; transform:scale(0.9); }
}
.success-checkmark-wrap { width:90px; height:90px; margin:0 auto; position:relative; }
.success-checkmark {
  width: 90px; height: 90px; border-radius: 50%; display: block;
  stroke-width: 3; stroke: #16a34a; stroke-miterlimit: 10;
  box-shadow: inset 0px 0px 0px #16a34a;
  animation: successFill 0.4s ease-in-out 0.4s forwards, successScale 0.3s ease-in-out 0.9s both;
}
.success-checkmark-circle {
  stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 3;
  stroke-miterlimit: 10; stroke: #16a34a; fill: none;
  animation: successStroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
}
.success-checkmark-check {
  transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48;
  animation: successStroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
}
@keyframes successStroke { 100% { stroke-dashoffset: 0; } }
@keyframes successScale {
  0%, 100% { transform: none; }
  50% { transform: scale3d(1.1, 1.1, 1); }
}
@keyframes successFill {
  100% { box-shadow: inset 0px 0px 0px 60px rgba(22, 163, 74, 0.1); }
}
/* ═══════════════════════════════════════════════════════════════ */
/* SUCCESS OVERLAY — v2 (Responsive Full Screen)                  */
/* ═══════════════════════════════════════════════════════════════ */

#successOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #163d78, #0d6ab0);
  z-index: 99999;
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
}

#successOverlay[style*="display: flex"],
#successOverlay.show {
  display: flex !important;
}

.success-card {
  background: #fff;
  border-radius: 24px;
  padding: 48px 40px;
  max-width: 460px;
  width: 100%;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,0.4);
  animation: successPopIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-sizing: border-box;
}

#successTitle {
  color: #163d78;
  margin: 24px 0 12px;
  font-size: 22px;
  font-weight: 800;
  font-family: 'Plus Jakarta Sans', sans-serif;
  line-height: 1.3;
}

#successMessage {
  color: #6b6459;
  font-size: 14.5px;
  line-height: 1.6;
  margin: 0 0 24px;
}

.success-progress-bar {
  height: 4px;
  background: #e8f1fb;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 24px;
}

#successProgressBar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #16a34a, #22c55e);
  transition: width linear;
  border-radius: 999px;
}

#successBtn {
  background: linear-gradient(135deg, #163d78, #0d6ab0);
  color: #fff;
  border: none;
  padding: 14px 32px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  font-family: 'Plus Jakarta Sans', sans-serif;
  box-sizing: border-box;
  transition: transform 0.15s ease;
}

#successBtn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(22,61,120,0.25);
}

.success-footer {
  color: #999;
  font-size: 11px;
  margin: 20px 0 0;
  letter-spacing: 0.3px;
}

/* Error mode */
#successOverlay.error-mode .success-checkmark-circle,
#successOverlay.error-mode .success-checkmark-check {
  stroke: #dc2626;
}
#successOverlay.error-mode #successTitle { color: #dc2626; }
#successOverlay.error-mode #successProgressBar {
  background: linear-gradient(90deg, #dc2626, #ef4444);
}

@media (max-width: 640px) {
  .stats-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 8px !important;
  }
  .stat-card { padding: 12px !important; }
  .stat-card .stat-value { font-size: 22px !important; }
  .stat-card .stat-label { font-size: 10.5px !important; }
  #analyticsChartsWrapper > div:first-child > div:nth-child(2) {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    gap: 8px !important;
  }
}

/* ─── 6. BACKLOG CARD — Stack vertikal di HP ────────────────────── */
@media (max-width: 640px) {
  #backlogCard { padding: 14px !important; }
  #backlogCard > div:first-child {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 12px !important;
  }
  #backlogCard > div:first-child > div:last-child { text-align: left !important; }
}

/* ─── 7. MODAL — Full screen di HP ──────────────────────────────── */
@media (max-width: 640px) {
  .modal-overlay { padding: 0 !important; align-items: flex-end !important; }
  .modal-box {
    max-width: 100% !important;
    width: 100% !important;
    max-height: 90vh !important;
    border-radius: 20px 20px 0 0 !important;
    padding: 20px 18px calc(18px + env(safe-area-inset-bottom)) !important;
    animation: slideUpMobile 0.25s ease-out;
  }
  @keyframes slideUpMobile {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-box .modal-actions {
    position: sticky;
    bottom: 0;
    background: var(--surface-card);
    padding: 12px 0 4px;
    margin-top: 14px;
    border-top: 1px solid var(--border);
    z-index: 20;
  }
  .modal-box .modal-actions .btn {
    min-height: 48px !important;
    font-size: 14.5px !important;
    font-weight: 700 !important;
    touch-action: manipulation !important;
    -webkit-tap-highlight-color: transparent;
  }
}

/* ─── 8. TABEL → CARD VIEW di HP ────────────────────────────────── */
@media (max-width: 640px) {
  .table-scroll table { min-width: 100% !important; } /* ✨ TAMBAHKAN INI */
  .table-scroll table thead { display: none !important; }
  .table-scroll table tbody tr {
    display: block !important;
    background: var(--surface-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    padding: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .table-scroll table tbody td {
    display: flex !important;
    justify-content: space-between;
    align-items: flex-start;
    padding: 6px 0 !important;
    border: none !important;
    border-bottom: 1px dashed var(--border) !important;
    font-size: 13px !important;
    gap: 10px;
  }
  .table-scroll table tbody td:last-child { border-bottom: none !important; }
  .table-scroll table tbody td::before {
    content: attr(data-label);
    font-weight: 700;
    color: var(--ink-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }
}

/* ─── 9. CHART HEIGHT — lebih pendek di HP ──────────────────────── */
@media (max-width: 640px) {
  #trendChart, #disciplineChart { max-height: 240px !important; }
}

/* ─── 10. TOAST — di atas keyboard ──────────────────────────────── */
@media (max-width: 640px) {
  .toast {
    bottom: calc(80px + env(safe-area-inset-bottom)) !important;
    left: 12px !important;
    right: 12px !important;
    transform: translateY(20px) !important;
    max-width: none !important;
    text-align: center;
  }
  .toast.show { transform: translateY(0) !important; }
}

/* ─── 11. FORM INPUTS — lebih nyaman di HP ──────────────────────── */
@media (max-width: 640px) {
  .form-row { grid-template-columns: 1fr !important; gap: 12px !important; }
  .form-group label { font-size: 13px !important; font-weight: 700 !important; }
  input, select, textarea { padding: 12px 14px !important; border-radius: 10px !important; }
  textarea { min-height: 90px !important; }
  .file-drop { padding: 20px 14px !important; }
  #submitBtn, #srSubmitBtn, #nfiSubmitBtn {
    position: sticky;
    bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 10;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }
}

/* ─── 12. SIDEBAR — swipe hint + auto-close ─────────────────────── */
@media (max-width: 860px) {
  .app-sidebar.open { box-shadow: 8px 0 30px rgba(0,0,0,0.35); }
  .sidebar-item {
    min-height: 48px;
    padding: 12px 14px !important;
    font-size: 14px !important;
  }
  .sidebar-item .si-icon { font-size: 18px !important; }
}

/* ─── 13. COMMAND CENTER PROJECT CARDS ──────────────────────────── */
@media (max-width: 640px) {
  .project-grid { grid-template-columns: 1fr !important; gap: 12px !important; }
  .cc-project-card { padding: 14px !important; }
  .cc-mini-stats { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
  .cc-mini-stat-val { font-size: 15px !important; }
  #analyticsProjectBanner > div {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 10px !important;
  }
}

/* ─── 14. iOS SAFE AREA (notch) ─────────────────────────────────── */
@supports (padding: max(0px)) {
  @media (max-width: 860px) {
    .app-header { padding-top: max(10px, env(safe-area-inset-top)) !important; }
    .app-sidebar {
      padding-top: max(20px, env(safe-area-inset-top)) !important;
      padding-bottom: max(30px, env(safe-area-inset-bottom)) !important;
    }
    .main-content { padding-bottom: max(60px, calc(60px + env(safe-area-inset-bottom))) !important; }
  }
}

/* ─── 15. LANDSCAPE HP — Optimasi ───────────────────────────────── */
@media (max-width: 860px) and (orientation: landscape) {
  .header-clock { display: none !important; }
  .modal-box { max-height: 96vh !important; }
}

/* ─── 16. DISABLE HOVER EFFECTS di touch device ─────────────────── */
@media (hover: none) {
  .project-card:hover,
  .cc-project-card:hover,
  .dash-alert-item:hover,
  .sidebar-item:hover {
    transform: none !important;
    box-shadow: none !important;
  }
}
